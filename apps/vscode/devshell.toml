[devshell]
name = "blueforest-vscode"
# The tools the release of this application needs.
packages = [
  "nodejs_24",
  "vsce",
  "coreutils",
  "gawk",
  "gnused",
  "gnugrep",
  "git",
  "curl",
  "jq",
  "gh",
]

[[commands]]
name = "package"
category = "utilities"
help = "Build the .vsix extension package"
command = '''
  set -euo pipefail
  cd "${PRJ_ROOT:-.}"
  pkg="$(node -p "require('./package.json').name")"
  ver="$(node -p "require('./package.json').version")"
  out="${pkg}-${ver}.vsix"
  echo "Building ${out}"
  vsce package --out "${out}"
'''

[[commands]]
package = "nixfmt"
category = "formatters"
help = "Nix code formatter"
