name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Verifies that every file is formatted (nixfmt, taplo, prettier, shfmt)
      # and that the shell script passes shellcheck.
      - name: Run flake checks
        run: nix flake check
