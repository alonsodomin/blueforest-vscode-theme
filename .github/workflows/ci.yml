name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    name: Checks (${{ matrix.flake }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The root flake checks every application at once, and each
        # application is checked on its own as well, because a consumer can
        # install just one of them.
        flake:
          - "."
          - "./modules/vscode"
          - "./modules/bat"
          - "./modules/starship"
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Verifies that every file is formatted (nixfmt, taplo, prettier, shfmt)
      # and that the shell script passes shellcheck.
      - name: Run flake checks
        run: nix flake check ${{ matrix.flake }}
