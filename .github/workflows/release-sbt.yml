# SPDX-License-Identifier: MPL-2.0

name: Release sbt
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check ./modules/sbt

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [check]
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
      version: ${{ steps.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        id: setup
        run: |
          version=$(cat modules/sbt/VERSION)
          echo "tag: sbt/$version"
          echo "tag=sbt/$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The package is a pair of .sbt files: the plugin declaration and the
      # selection of the theme. The prompt itself lives upstream.
      - name: Package the prompt
        run: |
          name=blueforest-sbt-prompt-${{ steps.setup.outputs.version }}
          mkdir -p "$name"
          cp modules/sbt/config/sbt-prompt.sbt \
            modules/sbt/config/blueforest-prompt.sbt \
            modules/sbt/NOTICE.md \
            modules/sbt/LICENSE \
            modules/sbt/README.md \
            "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: blueforest-sbt-prompt
          path: ./blueforest-sbt-prompt-*.tar.gz
          if-no-files-found: error

  publishGH:
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    needs: [check, package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blueforest-sbt-prompt

      # The release may already exist, for example when it was published by
      # hand to release the prompt. Only the assets are added in that case.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG exists already."
          else
            gh release create "$TAG" --title "Release $VERSION" --generate-notes
          fi

      - name: Upload assets to a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
        run: gh release upload "$TAG" ./blueforest-sbt-prompt-*.tar.gz --clobber
