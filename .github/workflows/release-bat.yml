# SPDX-License-Identifier: MPL-2.0

name: Release bat
on:
  workflow_call:
  workflow_dispatch:

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        id: setup
        run: |
          version=$(cat apps/bat/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package the theme
        run: cp apps/bat/themes/BlueForest.tmTheme ./blueforest-bat-theme-${{ steps.setup.outputs.version }}.tmTheme

      - uses: actions/upload-artifact@v4
        with:
          name: blueforest-bat-theme
          path: ./blueforest-bat-theme-*.tmTheme
          if-no-files-found: error

  publishGH:
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blueforest-bat-theme

      # The release is what triggers this workflow, so the theme is added to
      # it instead of creating one.
      - name: Add the theme to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || format('bat/{0}', needs.package.outputs.version) }}
        run: gh release upload "$TAG" ./blueforest-bat-theme-*.tmTheme --clobber
