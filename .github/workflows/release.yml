name: Release
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publishVSCode:
        description: "Publish the VS Code theme"
        type: boolean
        required: true
        default: "true"
      publishBat:
        description: "Publish the bat theme"
        type: boolean
        required: true
        default: "false"
      publishStarship:
        description: "Publish the Starship preset"
        type: boolean
        required: true
        default: "false"
      publishOpencode:
        description: "Publish the OpenCode theme"
        type: boolean
        required: true
        default: "false"
      publishMS:
        description: "Publish to the Microsoft Marketplace"
        type: boolean
        required: true
        default: "true"
      publishOVSX:
        description: "Publish to Open VSX"
        type: boolean
        required: true
        default: "true"
      publishGH:
        description: "Publish to GitHub Releases"
        type: boolean
        required: true
        default: "true"

jobs:
  # Every application of the repository has a workflow of its own, and this
  # one dispatches to them. Add a job here when an application is added, and
  # give it the workflow that releases it:
  #
  #   neovim:
  #     name: Neovim
  #     if: ${{ inputs.publishNeovim == true || startsWith(github.event.release.tag_name || '', 'neovim/') }}
  #     uses: ./.github/workflows/release-neovim.yml
  #     secrets: inherit
  vscode:
    name: VS Code
    # A GitHub release only releases the application its tag belongs to.
    if: ${{ inputs.publishVSCode == true || startsWith(github.event.release.tag_name || '', 'vscode/') }}
    uses: ./.github/workflows/release-vscode.yml
    with:
      publishMS: ${{ inputs.publishMS != false }}
      publishOVSX: ${{ inputs.publishOVSX != false }}
      publishGH: ${{ inputs.publishGH != false }}
    secrets: inherit
  bat:
    name: bat
    # A GitHub release only releases the application its tag belongs to.
    if: ${{ inputs.publishBat == true || startsWith(github.event.release.tag_name || '', 'bat/') }}
    uses: ./.github/workflows/release-bat.yml
    secrets: inherit
  starship:
    name: Starship
    # A GitHub release only releases the application its tag belongs to.
    if: ${{ inputs.publishStarship == true || startsWith(github.event.release.tag_name || '', 'starship/') }}
    uses: ./.github/workflows/release-starship.yml
    secrets: inherit
  opencode:
    name: OpenCode
    # A GitHub release only releases the application its tag belongs to.
    if: ${{ inputs.publishOpencode == true || startsWith(github.event.release.tag_name || '', 'opencode/') }}
    uses: ./.github/workflows/release-opencode.yml
    secrets: inherit
