# SPDX-License-Identifier: MPL-2.0

name: Release Neovim
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check ./modules/neovim

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [check]
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
      version: ${{ steps.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        id: setup
        run: |
          version=$(cat modules/neovim/VERSION)
          echo "tag: neovim/$version"
          echo "tag=neovim/$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The theme is a plugin: the colourscheme goes into the `colors`
      # directory, and the theme of lualine into the `lua/lualine/themes`
      # one, which is where Neovim and lualine read them from.
      - name: Package the theme
        run: |
          mkdir -p ./blueforest-neovim-theme-${{ steps.setup.outputs.version }}/colors
          mkdir -p ./blueforest-neovim-theme-${{ steps.setup.outputs.version }}/lua/lualine/themes
          cp modules/neovim/themes/blueforest.lua \
            ./blueforest-neovim-theme-${{ steps.setup.outputs.version }}/colors/blueforest.lua
          cp modules/neovim/themes/lualine-blueforest.lua \
            ./blueforest-neovim-theme-${{ steps.setup.outputs.version }}/lua/lualine/themes/blueforest.lua
          tar -czf ./blueforest-neovim-theme-${{ steps.setup.outputs.version }}.tar.gz \
            ./blueforest-neovim-theme-${{ steps.setup.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: blueforest-neovim-theme
          path: ./blueforest-neovim-theme-*.tar.gz
          if-no-files-found: error

  publishGH:
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    needs: [check, package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blueforest-neovim-theme

      # The release may already exist, for example when it was published by
      # hand to release the theme. Only the assets are added in that case.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG exists already."
          else
            gh release create "$TAG" --title "Release $VERSION" --generate-notes
          fi

      - name: Upload assets to a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
        run: gh release upload "$TAG" ./blueforest-neovim-theme-*.tar.gz --clobber
