[devshell]
name = "blueforest"
# The tools below mirror the runtimeInputs of the `release` app in flake.nix.
packages = ["coreutils", "gawk", "gnused", "gnugrep", "git", "curl", "jq", "gh"]

[[commands]]
name = "release"
category = "utilities"
help = "Interactive release helper"
command = '''
  exec "${PRJ_ROOT:-.}/tools/release.sh" "$@"
'''

[[commands]]
package = "nixfmt"
category = "formatters"
help = "Nix code formatter"
